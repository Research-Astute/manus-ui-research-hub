name: repository policy

on:
  pull_request:
    paths:
      - "README.md"
      - ".gitignore"
      - "scripts/ci/**"
      - "docs/**"
      - "inventory/**"
      - "assessments/**"
      - "fixtures/**"
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".gitignore"
      - "scripts/ci/**"
      - "docs/**"
      - "inventory/**"
      - "assessments/**"
      - "fixtures/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: tracked-file policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false
      - name: Validate tracked-file policy
        run: python3 scripts/ci/repository_policy.py
