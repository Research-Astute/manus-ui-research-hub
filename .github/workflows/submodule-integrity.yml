name: submodule integrity

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "research/manus-public-ui-research"
      - "development/manus-ui-adapter-lab"
      - "scripts/ci/hub_submodule_policy.py"
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "research/manus-public-ui-research"
      - "development/manus-ui-adapter-lab"
      - "scripts/ci/hub_submodule_policy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submodule-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: approved submodule pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false
      - name: Validate mapping and gitlinks
        run: python3 scripts/ci/hub_submodule_policy.py
